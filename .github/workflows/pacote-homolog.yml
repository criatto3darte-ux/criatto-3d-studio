# CR-009J.1 — Workflow manual (workflow_dispatch) para gerar e publicar
# o pacote de homologação como artifact baixável do GitHub Actions.
#
# Gatilho: push na branch arena/81a1f1ff-criatto-3d-studio (execução
# automática) e workflow_dispatch (disparo manual na UI do GitHub).
# Não faz merge na main, não altera hospedagem, não executa FTP,
# não altera Supabase/DNS/SSL.
#
# O artifact resultante (criatto3d-homolog.zip) fica disponível para download
# na página da execução do workflow, com retenção de 30 dias.
name: pacote-homolog

on:
  push:
    branches:
      - arena/81a1f1ff-criatto-3d-studio
  workflow_dispatch:

jobs:
  pacote-homolog:
    name: Pacote de homologacao (ZIP artifact)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun (gerenciador real do projeto, lockfile bun.lock)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - name: Install (--frozen-lockfile = reproduzivel)
        run: bun install --frozen-lockfile

      - name: Criar .env.homolog (variáveis públicas de homologação)
        run: |
          # VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY são valores públicos:
          # são embutidos no bundle do navegador pelo Vite. Não há service_role.
          # Idealmente estes valores viriam de secrets do repositório; enquanto
          # não forem adicionados, são informados aqui para o build funcionar.
          cat > .env.homolog << 'EOF'
          # Homologação — https://homolog.criatto3d.art.br
          # Usado apenas para o build de homologação (GitHub Actions).
          VITE_SUPABASE_URL=https://ugwuxczcqlrdjkpjsdqb.supabase.co
          VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnd3V4Y3pjcWxyZGprcGpzZHFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1OTkwMzgsImV4cCI6MjExMDE3NTAzOH0.4g5oKkg3JMiIf7g1GtPa4iltIS6NF9B2-fxLJR-Ij00
          VITE_APP_URL=https://homolog.criatto3d.art.br
          EOF

      - name: Build de homolgacao (SPA estatica, base=/)
        run: bun run build:homolog

      - name: Aplicar robots.txt de homolgacao
        run: cp public/robots-homolog.txt dist/robots.txt

      - name: Montar pacote ZIP
        run: |
          mkdir -p _pkg
          cp -r dist/* _pkg/
          cd _pkg
          zip -r ../criatto3d-homolog.zip .
          cd ..
          ls -la criatto3d-homolog.zip
          echo "SHA-256:"
          sha256sum criatto3d-homolog.zip

      - name: Validar ausencia de arquivos proibidos no pacote
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          unzip -q criatto3d-homolog.zip -d "$tmpdir"
          proibidos=$(find "$tmpdir" -name '*.map' -o -name '.env*' -o -name '*.sql' -o -name '*.sh' | head)
          if [[ -n "$proibidos" ]]; then
            echo "ARQUIVOS PROIBIDOS ENCONTRADOS:"; echo "$proibidos"; exit 1
          fi
          echo "Nenhum .map, .env*, .sql ou .sh no pacote. OK."
          rm -rf "$tmpdir"

      - name: Upload artifact (ZIP para download)
        uses: actions/upload-artifact@v4
        with:
          name: criatto3d-homolog.zip
          path: criatto3d-homolog.zip
          retention-days: 30
