name: pacote-homolog

on:
  push:
    branches:
      - arena/81a1f1ff-criatto-3d-studio

jobs:
  pacote-homolog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - name: Install (--frozen-lockfile)
        run: bun install --frozen-lockfile

      - name: Build de homologação
        run: bun run build:homolog
